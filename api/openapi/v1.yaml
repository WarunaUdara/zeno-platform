openapi: 3.1.0
info:
  title: Zeno API
  version: 1.0.0
  summary: Attendee and organizer event API
  description: >-
    Public event discovery and inventory-safe reservation APIs, opt-in Neon
    identity and tenant-scoped organizer authoring, order confirmation with
    per-unit ticket issuance, registration forms, and online check-in. Payment is
    not implemented; `payment_status` is a documented seam only.
servers:
  - url: https://api.zeno.example
    description: Example production origin; replace with the deployment hostname.
tags:
  - name: Health
    description: Process and dependency health checks.
  - name: Events
    description: Public, organizer-approved event catalog reads.
  - name: Reservations
    description: Idempotent short-lived ticket inventory holds.
  - name: Identity
    description: Opt-in identity verification; this does not imply tenant membership or authorization.
  - name: Organizations
    description: Authenticated organization workspaces and current membership.
  - name: Organizer workspace
    description: Tenant-scoped event drafting, ticket setup, and publication.
  - name: Orders
    description: Confirming a held reservation into an order and its per-unit tickets.
  - name: RegistrationForms
    description: Versioned questions an organizer asks and an attendee answers.
  - name: CheckIn
    description: Online admission by QR credential or short reference.
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Check whether the API process is alive
      security: []
      responses:
        '204':
          description: The API process can serve requests.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '404':
          $ref: '#/components/responses/NotFound'
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Check whether the API can reach PostgreSQL
      security: []
      responses:
        '204':
          description: The API and its database dependency are ready.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/events/{event_id}:
    get:
      operationId: getPublishedEvent
      tags: [Events]
      summary: Get a published event
      description: Exposes only fields the organizer published. Draft and private events are not returned.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Published event.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/events:
    get:
      operationId: listPublishedEvents
      tags: [Events]
      summary: Browse upcoming published events
      description: Returns only public events with a start time and published venue, ordered by start time. Pages are bounded to 50 events.
      security: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from the previous page's next_cursor.
          schema:
            type: string
            minLength: 1
            maxLength: 512
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: A page of upcoming public events.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedEventPage'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/auth/me:
    get:
      operationId: getAuthenticatedIdentity
      tags: [Identity]
      summary: Verify the current Neon Managed Auth bearer token
      description: >-
        Opt-in identity probe for an isolated Neon Auth environment. Validates
        EdDSA signature, issuer, expiry, and subject. It does not establish
        organization membership or authorize organizer actions. The route
        returns 503 when Neon Auth is not configured or its JWKS endpoint is
        unavailable.
      security:
        - neonBearer: []
      responses:
        '200':
          description: The verified Neon identity.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedIdentity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations:
    get:
      operationId: listOrganizations
      tags: [Organizations]
      summary: List organizations the current identity belongs to
      description: Returns only organizations joined to the verified issuer and subject. Pages are ordered by membership time and organization ID.
      security:
        - neonBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque continuation cursor from the previous page.
          schema:
            type: string
            minLength: 1
            maxLength: 512
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: Organizations and the caller's role in each.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createOrganization
      tags: [Organizations]
      summary: Create an organization and become its owner
      description: >-
        Creates an organization and owner membership atomically. Retrying the
        same name and slug as the same verified identity returns the existing
        organization; a slug owned by another identity returns conflict without
        revealing its name or membership.
      security:
        - neonBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
            example:
              name: Campus Arts Society
              slug: campus-arts
      responses:
        '200':
          description: Existing organization returned for a safe retry by its owner.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '201':
          description: Organization and owner membership created atomically.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Slug is unavailable to this identity.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/events/{event_id}/ticket-types:
    get:
      operationId: listPublishedTicketTypes
      tags: [Events]
      summary: List ticket types for a published event
      description: Reports availability as a coarse state and never exposes internal inventory counts.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Published ticket types in display order.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublishedTicketType'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations/{organization_id}/events:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      operationId: listOrganizerEvents
      tags: [Organizer workspace]
      summary: List events in an organization
      description: Lists events only when the verified identity is a member of the path organization. Pages use the stable starts_at NULLS LAST, id order and are bounded to 50 items.
      security:
        - neonBearer: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from the previous page's next_cursor.
          schema:
            type: string
            minLength: 1
            maxLength: 512
            pattern: '^[A-Za-z0-9_-]+$'
      responses:
        '200':
          description: Events visible to this organization member.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createOrganizerEvent
      tags: [Organizer workspace]
      summary: Create a draft event
      description: >-
        Requires owner, admin, or event_manager membership. The organization
        comes from the path and is verified server-side. The organization and
        slug pair is an idempotency boundary: retrying identical input returns
        the same event; reusing the slug with different input returns conflict.
      security:
        - neonBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizerEventRequest'
            example:
              slug: campus-summit-2027
              title: Campus Summit 2027
              timezone: Asia/Colombo
              starts_at: '2027-04-10T04:00:00Z'
              ends_at: '2027-04-10T12:00:00Z'
              venue:
                kind: physical
                name: City Hall
                city: Colombo
                country_code: LK
      responses:
        '200':
          description: Existing draft returned for an identical retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerEvent'
        '201':
          description: Draft event created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The slug already exists with different event values.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations/{organization_id}/events/{event_id}/ticket-types:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/EventId'
    post:
      operationId: createOrganizerTicketType
      tags: [Organizer workspace]
      summary: Add a ticket type to a draft event
      description: >-
        Requires owner, admin, or event_manager membership and a draft event in
        the same organization. Reuse the same idempotency key and identical
        payload after an uncertain response; different input with that key
        returns conflict. Keys must be generated from at least 128 random bits.
      security:
        - neonBearer: []
      parameters:
        - $ref: '#/components/parameters/AuthoringIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizerTicketRequest'
      responses:
        '200':
          description: Existing ticket type returned for an identical retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerTicketType'
        '201':
          description: Ticket type added to the draft event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerTicketType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The idempotency key was already used for different values.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: listOrganizerTicketTypes
      tags: [Organizer workspace]
      summary: List an event's ticket types
      description: >-
        Returns ticket setup to organization owners, admins, event managers,
        and analysts. Results are bounded to 100 ticket types.
      security:
        - neonBearer: []
      responses:
        '200':
          description: Ticket types configured for the event.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/OrganizerTicketType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations/{organization_id}/events/{event_id}/ticket-types/{ticket_type_id}:
    put:
      operationId: updateOrganizerDraftTicketType
      tags: [Organizer workspace]
      summary: Edit a ticket type in a draft event
      description: >-
        Replaces ticket details while the event remains a draft. Capacity may
        not be reduced below existing sales or holds. Requires owner, admin, or
        event_manager membership.
      security:
        - neonBearer: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/TicketTypeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizerTicketRequest'
      responses:
        '200':
          description: Updated ticket type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerTicketType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Published events cannot be edited or capacity conflicts with current inventory.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations/{organization_id}/events/{event_id}:
    get:
      operationId: getOrganizerEvent
      tags: [Organizer workspace]
      summary: Get an event in an organization
      description: Returns event details only to a verified member of the path organization.
      security:
        - neonBearer: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Event details visible to this organization member.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      operationId: updateOrganizerDraftEvent
      tags: [Organizer workspace]
      summary: Edit a draft event
      description: >-
        Replaces the editable event details while the event remains a draft.
        Published event details are immutable through this endpoint. Requires
        owner, admin, or event_manager membership.
      security:
        - neonBearer: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizerEventRequest'
      responses:
        '200':
          description: Updated draft event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The event is already published and cannot be edited.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations/{organization_id}/events/{event_id}/cover-uploads:
    post:
      operationId: createOrganizerCoverUpload
      tags: [Organizer workspace]
      summary: Create a private event-cover upload key
      description: >-
        Returns an event-scoped object key for a supported raster image.
        Requires owner, admin, or event_manager membership and a draft event.
      security:
        - neonBearer: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoverUploadRequest'
      responses:
        '200':
          description: Event-scoped key that the server can write to the private bucket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The event is already published.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations/{organization_id}/events/{event_id}/cover-image:
    put:
      operationId: updateOrganizerCoverImage
      tags: [Organizer workspace]
      summary: Set or remove a draft event cover image
      description: >-
        Stores only an event-scoped object key and accessible alt text.
        Send null for both fields to remove the image. Requires owner, admin,
        or event_manager membership; published events are immutable.
      security:
        - neonBearer: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverImageRequest'
      responses:
        '200':
          description: Updated event image metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The event is already published.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/organizations/{organization_id}/events/{event_id}/publish:
    post:
      operationId: publishOrganizerEvent
      tags: [Organizer workspace]
      summary: Publish a draft event
      description: >-
        Requires owner, admin, or event_manager membership. Publication is
        atomic and requires a future start time, valid timezone, venue, and at
        least one ticket type with remaining capacity and a sale window that
        has not ended. Publishing is a one-way transition in this API.
      security:
        - neonBearer: []
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '204':
          description: The event is now public.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The event is not ready to publish or is already published.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/events/{event_id}/ticket-types/{ticket_type_id}/reservations:
    post:
      operationId: createReservation
      tags: [Reservations]
      summary: Hold tickets for checkout
      description: >-
        Atomically reserves the requested quantity while the sale is open. The
        same idempotency key and request replay the original response for 24
        hours from the first accepted request. Keys are anonymous, at least
        128-bit random values encoded as unpadded base64url. The fingerprint
        covers event, ticket type, and quantity. The hold flow does not collect
        purchaser contact details; delivery requires a separate verified flow.
        Reusing a key with a different fingerprint returns a conflict. A hold
        has a separate, shorter lifetime and expires at expires_at if checkout
        is not completed; a replay can therefore return an already-expired hold.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/TicketTypeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
            example:
              quantity: 2
      responses:
        '201':
          description: Reservation created, or the original response replayed for the same key and payload.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Idempotency-Key-Expires-At:
              description: Absolute time, 24 hours after the first accepted request, when this idempotency key may be reused.
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Inventory is unavailable, the sale is closed, or the key was reused with a different payload.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                inventoryUnavailable:
                  value:
                    type: about:blank
                    title: Inventory unavailable
                    status: 409
                    detail: The requested quantity is no longer available.
                    error:
                      code: INVENTORY_UNAVAILABLE
                    request_id: req_01J9WZ6Q2CX7F2YV
                saleClosed:
                  value:
                    type: about:blank
                    title: Sale closed
                    status: 409
                    detail: Reservations are not available during this sale window.
                    error:
                      code: SALE_CLOSED
                    request_id: req_01J9WZ6Q2CX7F2YV
                idempotencyConflict:
                  value:
                    type: about:blank
                    title: Idempotency key conflict
                    status: 409
                    detail: This key was already used for a different request.
                    error:
                      code: IDEMPOTENCY_KEY_REUSED
                    request_id: req_01J9WZ6Q2CX7F2YV
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/events/{event_id}/reservations/{reservation_id}:
    delete:
      operationId: releaseReservation
      tags: [Reservations]
      summary: Release an attendee's temporary ticket hold
      description: >-
        Releases the caller's temporary hold and makes its inventory available
        again. This anonymous flow is authorized by the same high-entropy key
        used to create the reservation; knowing a reservation ID is not
        sufficient. Repeating a release is safe. A hold whose expiry time has
        passed returns expired because it is no longer an active hold.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: reservation_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PublicId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The hold was released, had already expired, or was already released.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseReservationResult'
        '404':
          description: Reservation was not found or the key does not authorize it.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/events/{event_id}/reservations/{reservation_id}/confirm:
    post:
      operationId: confirmReservation
      tags: [Orders]
      summary: Turn a held reservation into a confirmed order and issue its tickets
      description: >-
        Commits the hold, converts it to an order, and issues one ticket per unit.
        A company that bought ten tickets receives ten independently
        check-in-able tickets, so colleagues can arrive at different times.

        Safe to retry. The response to a checkout that timed out on a flaky
        connection returns the original order and the same ticket credentials
        rather than creating a second order. A hold that has already elapsed
        returns RESERVATION_EXPIRED and issues nothing.

        Registration answers are validated against the event's published form. An
        answer to a question that is not on the form, or a missing required
        answer, returns INVALID_REGISTRATION_ANSWERS and issues nothing.

        No payment is taken. `payment_status` exists as a seam for a future
        payment adapter; nothing in this service collects money.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: reservation_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/PublicId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmOrderRequest'
      responses:
        '200':
          description: The order and its tickets. Returned in full on a retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmedOrder'
        '404':
          description: The reservation could not be found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: >-
            The hold has expired (RESERVATION_EXPIRED) or is no longer available
            (RESERVATION_UNAVAILABLE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: >-
            INVALID_REQUEST or INVALID_REGISTRATION_ANSWERS. Nothing was issued.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: SERVICE_UNAVAILABLE, or ORDERING_UNAVAILABLE when this deployment has no credential key configured.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/events/{event_id}/registration-form:
    get:
      operationId: getPublicRegistrationForm
      tags: [RegistrationForms]
      summary: Read the questions an attendee is asked when booking
      description: >-
        Returns the published form for a public event so a guest can be asked the
        right questions before confirming. Returns 404 when the event has no
        published form.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The published form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationForm'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/organizations/{organization_id}/events/{event_id}/registration-form:
    put:
      operationId: publishRegistrationForm
      tags: [RegistrationForms]
      summary: Publish a new version of an event's registration form
      security:
        - neonBearer: []
      description: >-
        Creates a new form version and retires the previous one. Confirmed
        bookings keep pointing at the version they were answered against, so
        historical answers stay readable after an organizer edits their questions.

        Each save therefore adds a version rather than editing in place. Only one
        version is published at a time. A field key must be a stable lowercase
        identifier; changing a label later does not orphan stored answers.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRegistrationFormRequest'
      responses:
        '204':
          description: The form version was published.
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/organizations/{organization_id}/events/{event_id}/check-ins:
    post:
      operationId: scanCheckIns
      tags: [CheckIn]
      summary: Admit guests by scanning their ticket codes
      security:
        - neonBearer: []
      description: >-
        Admits up to 50 codes in one request, so a group walking in together is a
        single round trip rather than a queue at the door. Each code may be a QR
        credential or a short reference staff can type when a camera cannot read
        the code.

        Admission is atomic per ticket. Two gates scanning the same guest in the
        same second produce exactly one admission and one "already admitted"
        result. Repeating the identical request with the same
        `scanner_action_id` replays the original outcome instead of recording a
        second admission, so a scanner retrying over poor venue connectivity is
        safe.

        A code belonging to another organization or another event is reported as
        `unknown`, never as forbidden, so a scanner cannot discover which ticket
        identifiers exist elsewhere.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanCheckInsRequest'
      responses:
        '200':
          description: One outcome per submitted code, in the order submitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScanResult'
        '404':
          description: The caller is not a member of this organization.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/organizations/{organization_id}/events/{event_id}/attendance:
    get:
      operationId: getEventAttendance
      tags: [CheckIn]
      summary: Arrival counts for an event
      security:
        - neonBearer: []
      description: >-
        Derived from ticket state rather than an incremented counter, so it cannot
        drift. `awaiting` is how many issued tickets have not been admitted yet,
        which is the number an organizer cares about while guests are still
        arriving.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Arrival counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    neonBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestId:
      description: Correlation identifier shared by the response and structured request logs.
      schema:
        type: string
        pattern: '^req_[A-Za-z0-9]{26}$'
  parameters:
    EventId:
      name: event_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicId'
    TicketTypeId:
      name: ticket_type_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicId'
    OrganizationId:
      name: organization_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/PublicId'
    AuthoringIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A URL-safe key of at least 128 random bits, reused only for retries of this ticket creation.
      schema:
        type: string
        minLength: 22
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]{22,128}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Anonymous key for one reservation intent. Generate at least 128 bits
        with a cryptographically secure random source and encode as unpadded
        base64url. The same key is unique across this operation and is retained
        for 24 hours from the first accepted request. Reuse after the returned
        expiry deadline is allowed. See API_DESIGN.md for fingerprint details.
      schema:
        type: string
        minLength: 22
        maxLength: 128
        pattern: '^[A-Za-z0-9_-]{22,128}$'
  responses:
    Unauthorized:
      description: A valid Neon Managed Auth bearer token is required.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found or not publicly visible.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Request fields are syntactically valid but violate a domain rule.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Service is not ready or is shedding load. Retry with bounded backoff.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Optional seconds before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreateOrganizationRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          minLength: 3
          maxLength: 62
          pattern: '^[a-z0-9]([a-z0-9-]{1,60}[a-z0-9])$'
    Organization:
      type: object
      required: [id, name, slug, role, created_at]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        name:
          type: string
        slug:
          type: string
        role:
          type: string
          enum: [owner, admin, event_manager, check_in_manager, analyst]
        created_at:
          type: string
          format: date-time
    OrganizationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Organization'
        next_cursor:
          type: [string, 'null']
          description: Opaque continuation cursor for the next organization page.
    OrganizerEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrganizerEventSummary'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor to pass back to fetch the next page.
    AuthenticatedIdentity:
      type: object
      required: [subject]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 256
    CreateOrganizerEventRequest:
      type: object
      additionalProperties: false
      required: [slug, title, timezone]
      properties:
        slug:
          type: string
          minLength: 3
          maxLength: 80
          pattern: '^[a-z0-9]([a-z0-9-]{1,78}[a-z0-9])$'
        title:
          type: string
          minLength: 1
          maxLength: 160
        summary:
          type: [string, 'null']
          maxLength: 1000
        starts_at:
          type: [string, 'null']
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        timezone:
          type: string
          minLength: 1
          maxLength: 128
          description: IANA timezone identifier. Validated before publication.
        venue:
          anyOf:
            - $ref: '#/components/schemas/PhysicalVenue'
            - $ref: '#/components/schemas/OnlineVenue'
            - type: 'null'
        accessibility_info:
          type: [string, 'null']
          maxLength: 2000
          description: Optional public information about access needs and venue accessibility.
        cancellation_policy:
          type: [string, 'null']
          maxLength: 2000
          description: Optional public cancellation or transfer terms supplied by the organizer.
        support_email:
          type: [string, 'null']
          maxLength: 254
          format: email
    OrganizerEvent:
      type: object
      required: [id, slug, title, timezone, visibility, starts_at, ends_at, summary, venue, accessibility_info, cancellation_policy, support_email, cover_image_key, cover_image_alt]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        slug:
          type: string
        title:
          type: string
        summary:
          type: [string, 'null']
        starts_at:
          type: [string, 'null']
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        timezone:
          type: string
        visibility:
          type: string
          enum: [draft, public]
        venue:
          anyOf:
            - $ref: '#/components/schemas/PhysicalVenue'
            - $ref: '#/components/schemas/OnlineVenue'
            - type: 'null'
        accessibility_info:
          type: [string, 'null']
          maxLength: 2000
        cancellation_policy:
          type: [string, 'null']
          maxLength: 2000
        support_email:
          type: [string, 'null']
          maxLength: 254
          format: email
        cover_image_key:
          type: [string, 'null']
          maxLength: 200
        cover_image_alt:
          type: [string, 'null']
          maxLength: 240
    CreateCoverUploadRequest:
      type: object
      required: [content_type]
      additionalProperties: false
      properties:
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    CoverUpload:
      type: object
      required: [key, content_type]
      properties:
        key:
          type: string
          maxLength: 200
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
    CoverImageRequest:
      type: object
      required: [key, alt]
      additionalProperties: false
      properties:
        key:
          type: [string, 'null']
          maxLength: 200
        alt:
          type: [string, 'null']
          maxLength: 240
    OrganizerEventSummary:
      type: object
      required: [id, slug, title, timezone, visibility, starts_at, ends_at, summary, venue]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        slug:
          type: string
        title:
          type: string
        summary:
          type: [string, 'null']
        starts_at:
          type: [string, 'null']
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        timezone:
          type: string
        visibility:
          type: string
          enum: [draft, public]
        venue:
          anyOf:
            - $ref: '#/components/schemas/PhysicalVenue'
            - $ref: '#/components/schemas/OnlineVenue'
            - type: 'null'
    UpdateOrganizerEventRequest:
      type: object
      additionalProperties: false
      required: [title, timezone]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        summary:
          type: [string, 'null']
          maxLength: 1000
        starts_at:
          type: [string, 'null']
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        timezone:
          type: string
          minLength: 1
          maxLength: 128
        venue:
          anyOf:
            - $ref: '#/components/schemas/PhysicalVenue'
            - $ref: '#/components/schemas/OnlineVenue'
            - type: 'null'
        accessibility_info:
          type: [string, 'null']
          maxLength: 2000
        cancellation_policy:
          type: [string, 'null']
          maxLength: 2000
        support_email:
          type: [string, 'null']
          maxLength: 254
          format: email
    CreateOrganizerTicketRequest:
      type: object
      additionalProperties: false
      required: [name, amount, currency, capacity, sale_starts_at, sale_ends_at]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 500
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]{0,13})(\.[0-9]{1,4})?$'
          description: Decimal string; binary floating point is not accepted.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        capacity:
          type: integer
          minimum: 1
        sale_starts_at:
          type: string
          format: date-time
        sale_ends_at:
          type: string
          format: date-time
    OrganizerTicketType:
      type: object
      required: [id, name, description, amount, currency, capacity, sale_starts_at, sale_ends_at]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        name:
          type: string
        description:
          type: [string, 'null']
        amount:
          type: string
        currency:
          type: string
        capacity:
          type: integer
        sale_starts_at:
          type: string
          format: date-time
        sale_ends_at:
          type: string
          format: date-time
    PublicId:
      type: string
      pattern: '^zeno_[A-Za-z0-9]{16,32}$'
      examples: [zeno_01J9WZ6Q2CX7F2YV8AX0P4TD7K]
    PublishedEvent:
      type: object
      required: [id, title, starts_at, timezone, visibility, venue, accessibility_info, cancellation_policy, support_email, cover_image_key, cover_image_alt]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        title:
          type: string
          minLength: 1
          maxLength: 160
        summary:
          type: [string, 'null']
          maxLength: 1000
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        timezone:
          type: string
          description: IANA time zone identifier used for attendee display.
          examples: [Asia/Colombo]
        visibility:
          type: string
          const: public
        venue:
          oneOf:
            - $ref: '#/components/schemas/PhysicalVenue'
            - $ref: '#/components/schemas/OnlineVenue'
        accessibility_info:
          type: [string, 'null']
          maxLength: 2000
        cancellation_policy:
          type: [string, 'null']
          maxLength: 2000
        support_email:
          type: [string, 'null']
          maxLength: 254
          format: email
        cover_image_key:
          type: [string, 'null']
          maxLength: 200
        cover_image_alt:
          type: [string, 'null']
          maxLength: 240
    PublishedEventPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublishedEventSummary'
        next_cursor:
          type: [string, 'null']
          description: Opaque cursor to pass back to fetch the next page.
    PublishedEventSummary:
      type: object
      required: [id, title, starts_at, timezone, visibility, venue]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        title:
          type: string
          minLength: 1
          maxLength: 160
        summary:
          type: [string, 'null']
          maxLength: 1000
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: [string, 'null']
          format: date-time
        timezone:
          type: string
        visibility:
          type: string
          const: public
        venue:
          oneOf:
            - $ref: '#/components/schemas/PhysicalVenue'
            - $ref: '#/components/schemas/OnlineVenue'
    PhysicalVenue:
      type: object
      additionalProperties: false
      required: [kind, name, city, country_code]
      properties:
        kind:
          const: physical
        name:
          type: string
          maxLength: 160
        city:
          type: string
          maxLength: 120
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
    OnlineVenue:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: online
    PublishedTicketType:
      type: object
      required: [id, name, price, availability]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: [string, 'null']
          maxLength: 500
        price:
          $ref: '#/components/schemas/Money'
        availability:
          type: string
          enum: [available, sold_out, not_on_sale]
    CreateReservationRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 100
    Reservation:
      type: object
      required: [id, event_id, ticket_type_id, quantity, amount_due, status, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        event_id:
          $ref: '#/components/schemas/PublicId'
        ticket_type_id:
          $ref: '#/components/schemas/PublicId'
        quantity:
          type: integer
          minimum: 1
        amount_due:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          const: held
        expires_at:
          type: string
          format: date-time
    ReleaseReservationResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [released, expired]
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,4})?$'
          description: Decimal amount encoded as a string; never use binary floating point for money.
          examples: ['1250.00']
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 currency code.
          examples: [LKR]
    ConfirmOrderRequest:
      type: object
      additionalProperties: false
      required: [purchaser_name, purchaser_email]
      properties:
        purchaser_name:
          type: string
          minLength: 1
          maxLength: 120
          description: Who booked the tickets. A single character is accepted.
          examples: ['Campus Arts Society']
        purchaser_email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
          description: >-
            Contact for this booking. Deliberately permissive: rejecting a real
            address is more damaging than accepting a typo, and it is not used to
            send anything yet.
          examples: ['society@example.com']
        answers:
          type: array
          default: []
          maxItems: 50
          description: >-
            Answers to the event's published form. A multi-choice question is sent
            as several entries sharing one `field_key`.
          items:
            type: object
            additionalProperties: false
            required: [field_key, value]
            properties:
              field_key:
                type: string
                pattern: '^[a-z0-9]([a-z0-9_]{0,38}[a-z0-9])$'
              value:
                type: string
                maxLength: 2000

    ConfirmedOrder:
      type: object
      required: [id, organization_id, event_id, ticket_type_id, quantity, total_amount, purchaser_name, purchaser_email, confirmed_at, tickets, answers]
      properties:
        id:
          $ref: '#/components/schemas/PublicId'
        organization_id:
          $ref: '#/components/schemas/PublicId'
        event_id:
          $ref: '#/components/schemas/PublicId'
        ticket_type_id:
          $ref: '#/components/schemas/PublicId'
        quantity:
          type: integer
          minimum: 1
          maximum: 100
        total_amount:
          $ref: '#/components/schemas/Money'
        purchaser_name:
          type: string
        purchaser_email:
          type: string
        confirmed_at:
          type: string
          format: date-time
        tickets:
          type: array
          minItems: 1
          maxItems: 100
          description: One ticket per unit, each independently check-in-able.
          items:
            type: object
            required: [id, sequence, reference, credential]
            properties:
              id:
                $ref: '#/components/schemas/PublicId'
              sequence:
                type: integer
                minimum: 1
                description: Position within the order, so staff can say "ticket 3 of 10".
              reference:
                type: string
                pattern: '^[A-Z0-9]{8,10}$'
                description: Short code staff can type when a camera cannot read the QR code.
              credential:
                type: string
                description: >-
                  The value encoded in the QR code. Only its digest is stored, so
                  this is re-rendered from a sealed copy for the order owner.
                examples: ['zeno_t_1pN7fH2sQ9xKc0bWm4TvYdE8LrZ3aJgXpN1uBqCeF6hI']
              attendee_name:
                type: [string, 'null']
        answers:
          type: array
          description: Snapshot of the submitted answers, with the question labels as asked at the time.
          items:
            type: object
            required: [field_key, field_label, value]
            properties:
              field_key:
                type: string
              field_label:
                type: string
              value:
                type: string

    RegistrationForm:
      type: object
      required: [name, version, fields]
      properties:
        name:
          type: string
        version:
          type: integer
          minimum: 1
        fields:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/RegistrationFormField'

    RegistrationFormField:
      type: object
      required: [field_key, label, field_type, required, options]
      properties:
        field_key:
          type: string
          pattern: '^[a-z0-9]([a-z0-9_]{0,38}[a-z0-9])$'
        label:
          type: string
          maxLength: 160
        help_text:
          type: [string, 'null']
          maxLength: 500
        field_type:
          type: string
          enum: [short_text, long_text, email, phone, number, single_choice, multi_choice, checkbox]
        required:
          type: boolean
        options:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 120
          description: Choice options. Empty for every field type except the two choice types.

    PublishRegistrationFormRequest:
      type: object
      additionalProperties: false
      required: [name, fields]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        fields:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [field_key, label, field_type]
            properties:
              field_key:
                type: string
                pattern: '^[a-z0-9]([a-z0-9_]{0,38}[a-z0-9])$'
              label:
                type: string
                minLength: 1
                maxLength: 160
              help_text:
                  type: [string, 'null']
                  maxLength: 500
              field_type:
                type: string
                enum: [short_text, long_text, email, phone, number, single_choice, multi_choice, checkbox]
              required:
                type: boolean
              options:
                type: array
                maxItems: 50
                items:
                  type: string
                  maxLength: 120

    ScanCheckInsRequest:
      type: object
      additionalProperties: false
      required: [codes, scanner_action_id]
      properties:
        codes:
          type: array
          minItems: 1
          maxItems: 50
          description: QR credentials or short references, in the order the door reported them.
          items:
            type: string
            maxLength: 128
        scanner_action_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{8,64}$'
          description: >-
            Client-generated id for this scan. Repeating the identical request
            replays the original outcome instead of recording a second
            admission, which is what makes a retry over poor connectivity safe.

    ScanResult:
      type: object
      required: [outcome, replayed]
      properties:
        outcome:
          type: object
          description: >-
            `admitted` when the guest was admitted, `already_admitted` with the
            time of the first admission, `voided`, or `unknown` when no ticket in
            this event matches. A scanner needs these as distinct cases because
            each needs different words said at the door.
          required: [outcome]
          oneOf:
            - type: object
              additionalProperties: false
              required: [outcome, ticket_id, sequence, reference]
              properties:
                outcome: { type: string, enum: [admitted] }
                ticket_id: { $ref: '#/components/schemas/PublicId' }
                sequence: { type: integer, minimum: 1 }
                reference: { type: string }
                attendee_name: { type: [string, 'null'] }
            - type: object
              additionalProperties: false
              required: [outcome, ticket_id, sequence, reference, checked_in_at]
              properties:
                outcome: { type: string, enum: [already_admitted] }
                ticket_id: { $ref: '#/components/schemas/PublicId' }
                sequence: { type: integer, minimum: 1 }
                reference: { type: string }
                checked_in_at: { type: string, format: date-time }
            - type: object
              additionalProperties: false
              required: [outcome, ticket_id, sequence, reference]
              properties:
                outcome: { type: string, enum: [voided] }
                ticket_id: { $ref: '#/components/schemas/PublicId' }
                sequence: { type: integer, minimum: 1 }
                reference: { type: string }
            - type: object
              additionalProperties: false
              required: [outcome]
              properties:
                outcome: { type: string, enum: [unknown] }
        replayed:
          type: boolean
          description: True when this request was a retry of a scan already recorded.

    Attendance:
      type: object
      required: [event_id, issued, admitted, awaiting, voided]
      properties:
        event_id:
          $ref: '#/components/schemas/PublicId'
        issued:
          type: integer
          minimum: 0
        admitted:
          type: integer
          minimum: 0
        awaiting:
          type: integer
          minimum: 0
          description: Issued tickets not yet admitted. Non-zero while guests are still arriving.
        voided:
          type: integer
          minimum: 0

    Problem:
      type: object
      description: RFC 9457 problem details with stable machine-readable error metadata.
      required: [type, title, status, error, request_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        request_id:
          type: string
          minLength: 1
          maxLength: 128
