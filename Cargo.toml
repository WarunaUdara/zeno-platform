[workspace]
members = ["apps/api"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
version = "0.1.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/WarunaUdara/zeno-platform"

[workspace.dependencies]
axum = { version = "0.8", features = ["json"] }
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
prometheus = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ulid = "1"

[workspace.dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio-rustls", "postgres", "chrono", "migrate", "macros", "rust_decimal", "json"]
